<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Puzzle Garden preview fixture</title>
    <style>
      :root { font-family: Inter, system-ui, sans-serif; color: #172033; background: #e8eefc; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; padding: 0; background: radial-gradient(circle at 50% 20%, #dbeafe 0, #eff6ff 35%, #e0e7ff 100%); }
      main { width: 100%; min-height: 100vh; display: flex; flex-direction: column; padding: 20px; background: transparent; }
      header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
      .eyebrow { margin: 0 0 8px; color: #64748b; font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(24px, 5vw, 32px); letter-spacing: -.04em; }
      .status { border-radius: 999px; padding: 6px 12px; color: #047857; background: #d1fae5; font-size: 12px; font-weight: 600; white-space: nowrap; }
      .board-wrap { flex: 1; border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px; background: rgba(255,255,255,.72); }
      p { margin: 0; color: #475569; font-size: 14px; line-height: 1.5; }
      .board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
      button.tile { aspect-ratio: 1; border: 1px solid #e2e8f0; border-radius: 12px; color: #172033; background: #f8fafc; font-size: 28px; cursor: pointer; }
      button.tile:hover { border-color: #94a3b8; background: #fff; transform: translateY(-2px); }
      .start { align-self: flex-start; min-height: 40px; margin-top: 12px; border: 0; border-radius: 999px; padding: 0 18px; color: #fff; background: #0f172a; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <header><div><p class="eyebrow">Playable preview</p><h1>Puzzle Garden</h1></div><span class="status">Live fixture</span></header>
      <section class="board-wrap"><p>Connect the matching flowers before the timer runs out.</p><div class="board" aria-label="Puzzle board">
        <button class="tile" type="button">🌼</button><button class="tile" type="button">🪻</button><button class="tile" type="button">🌱</button><button class="tile" type="button">🌼</button><button class="tile" type="button">🌱</button><button class="tile" type="button">🪻</button><button class="tile" type="button">🌷</button><button class="tile" type="button">🌷</button>
      </div></section>
      <button class="start" type="button" id="start-round">Start round</button>
    </main>
    <script>
      const startRound = document.querySelector('#start-round');
      const status = document.querySelector('.status');
      startRound?.addEventListener('click', () => {
        startRound.textContent = 'Round started';
        status.textContent = 'Playing fixture';
      });
      document.querySelectorAll('.tile').forEach((tile, index) => {
        tile.addEventListener('click', () => {
          tile.setAttribute('aria-label', `Flower tile ${index + 1} selected`);
        });
      });
    </script>
  </body>
</html>
