name: Backend checks

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'supabase/**'
      - 'docker/**'
      - '.beegame/skills/**'
      - 'vendor/bgs'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - '.github/workflows/backend-checks.yml'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'supabase/**'
      - 'docker/**'
      - '.beegame/skills/**'
      - 'vendor/bgs'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - '.github/workflows/backend-checks.yml'

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BGS_SANDBOX_TESTS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25.2.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install locked workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check backend types
        run: bun run typecheck
      - name: Install isolated SQL test engine
        run: |
          mkdir -p "$RUNNER_TEMP/bgs-sql-tests"
          bun add --cwd "$RUNNER_TEMP/bgs-sql-tests" --ignore-scripts --exact @electric-sql/pglite@0.5.10
      # These suites use temporary files and local fake services. Browser and
      # real native-process regressions run in separate jobs below.
      - name: Run backend and deployment regressions
        env:
          BGS_PGLITE_MODULE: ${{ runner.temp }}/bgs-sql-tests/node_modules/@electric-sql/pglite/dist/index.js
        run: >-
          bun test
          packages/agent-workflow/src
          packages/beegame-security-core/src
          packages/beegame-skills-core/src
          packages/beegame-skills-server/src
          packages/beegame-billing-core/src
          packages/beegame-billing-server/src
          packages/beegame-storage-core/src
          packages/agent-workflow-server/src/auth
          packages/agent-workflow-server/src/model-providers
          packages/agent-workflow-server/src/bgs/skills.test.ts
          packages/agent-workflow-server/src/local-runtime-service.test.ts
          packages/agent-workflow-server/src/beegame/asset-upload.test.ts
          packages/agent-workflow-server/src/beegame/runtime-acceptance.test.ts
          packages/agent-workflow-server/src/beegame/content-binding.test.ts
          packages/agent-workflow-server/src/beegame/workflow-v3/ui-binding-coverage.test.ts
          packages/agent-workflow-server/src/beegame/workflow-v3/resource-structure.test.ts
          packages/agent-workflow-server/src/beegame/asset-contract-audit.test.ts
          packages/agent-workflow-server/src/beegame/asset-manifest-authoring-contract.test.ts
          packages/agent-workflow-server/src/__tests__/asset-contracts-resource-binding.test.ts
          packages/agent-workflow-server/src/beegame/game-content-package.test.ts
          packages/agent-workflow-server/src/beegame/workflow-read-tools.test.ts
          packages/agent-workflow-server/src/beegame/workflow-v3/project-guide.test.ts
          packages/beegame-resource-server/src/__tests__/resource-dependency-bindings.test.ts
          packages/beegame-resource-server/src/__tests__/resource-inspection.test.ts
          packages/agent-workflow-server/src/image-generation
          packages/agent-workflow-server/src/beegame/project-asset-command.test.ts
          packages/agent-workflow-server/src/beegame/model-runtime-security.test.ts
          packages/agent-workflow-server/src/beegame/session-usage-billing.test.ts
          packages/agent-workflow-server/src/__tests__/preview-manager.test.ts
          packages/agent-workflow-server/src/__tests__/preview-authorization.test.ts
          packages/agent-workflow-server/src/__tests__/asset-manifest-async-read.test.ts
          packages/agent-workflow-server/src/__tests__/v3-legacy-session-mutation.test.ts
          packages/agent-workflow-server/src/__tests__/v3-project-delete-route.test.ts
          scripts/__tests__/saas-preflight.test.ts
          scripts/__tests__/supabase-rest-pagination.test.ts
          scripts/__tests__/docker-runtime-permissions.test.ts
          scripts/__tests__/beegame-owner-bootstrap.test.ts
          scripts/__tests__/beegame-migration-cli.test.ts

  native:
    # Existing native fixtures exercise macOS Seatbelt and use /private/tmp.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # build-bgs records the nearest upstream tag from the pinned submodule.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '25.2.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install locked workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Fetch native release tags and identify the pinned source
        id: bgs-source
        # The maintained fork has no release tags; provenance uses upstream tags.
        run: |
          git -C vendor/bgs fetch https://github.com/openai/codex.git 'refs/tags/rust-v*:refs/tags/rust-v*'
          echo "commit=$(git -C vendor/bgs rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache the source-built native runtime
        id: bgs-runtime
        uses: actions/cache@v4
        with:
          path: dist/bgs-runtime
          key: bgs-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.bgs-source.outputs.commit }}-${{ hashFiles('scripts/build-bgs.ts') }}
      - name: Fetch locked Rust dependencies
        if: steps.bgs-runtime.outputs.cache-hit != 'true'
        working-directory: vendor/bgs/bgs-rs
        env:
          # Use system git for the pinned dependencies' nested submodules.
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        # Cargo/rustup reads this checkout's rust-toolchain.toml.
        run: cargo fetch --locked
      - name: Build the pinned native runtime
        if: steps.bgs-runtime.outputs.cache-hit != 'true'
        env:
          # Keep the cold debug build within a standard runner's disk and memory.
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
          CARGO_BUILD_JOBS: '2'
        run: bun run bgs:build
      - name: Verify native packaging and local plugin operations
        run: bun run bgs:verify
      - name: Run native protocol and sandbox fixtures
        env:
          BGS_SANDBOX_TESTS: '1'
        run: >-
          bun test
          packages/agent-workflow-server/src/bgs/integration.test.ts
          packages/agent-workflow-server/src/model-providers/integration.test.ts
          packages/agent-workflow-server/src/bgs/goals.native.test.ts
          packages/agent-workflow-server/src/bgs/preferences.native.test.ts
          packages/agent-workflow-server/src/bgs/skills.native.test.ts
          packages/agent-workflow-server/src/bgs/project-file-tools.native.test.ts
          packages/agent-workflow-server/src/bgs/short-context.native.test.ts

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BGS_LAYOUT_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25.2.1'
      - uses: oven-sh/setup-bun@v2
        with:
          # Bun 1.3.14 can close reused Chromium pipe fds during GC (oven-sh/bun#34785).
          bun-version: '1.4.3'
      - name: Install locked workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Chromium and Linux dependencies
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        working-directory: packages/agent-workflow-server
        run: ./node_modules/.bin/playwright-core install chromium --with-deps --no-progress
      - name: Run Scene Editor browser regressions
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: >-
          bun test
          packages/agent-workflow-server/src/beegame/scene-layout-browser.test.ts
          packages/agent-workflow-server/src/beegame/scene-model-browser.test.ts
