name: Frontend checks

on:
  pull_request:
    paths:
      - 'apps/frontend/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/frontend-checks.yml'
  push:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/frontend-checks.yml'

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25.2.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install locked workspace dependencies
        working-directory: .
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check types
        run: bun run typecheck
      - name: Run frontend tests
        run: bun run test:run --maxWorkers=2
      - name: Build production frontend
        run: bun run build
      - name: Build shared UI inspector
        run: bun build ../../packages/scene-editor/src/ui-preview/uiStaticInspection.tsx --target=browser --minify --outfile="${{ runner.temp }}/ui-inspector.mjs"
