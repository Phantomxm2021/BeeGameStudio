name: Core alignment

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  audit-pinned-core:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Bee Game Studio
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check out pinned upstream core
        run: |
          git clone --filter=blob:none https://github.com/claude-code-best/claude-code.git /tmp/beegame-pinned-core
          git -C /tmp/beegame-pinned-core checkout --detach 3bb6b5746238c418138eb96d57765d79012edd96

      - name: Audit normalized core
        run: bun run core:audit -- --upstream /tmp/beegame-pinned-core
